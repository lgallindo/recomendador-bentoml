name: Preparar tutorial HTML (opcional)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: pandoc/actions/setup@v1
        with:
          version: '3.10.1'
      - name: Gerar tutorial e explorador
        run: python scripts/gerar_site_tutorial.py --saida .local/pages-build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .local/pages-build
