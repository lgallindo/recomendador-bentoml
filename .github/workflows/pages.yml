name: Publicar tutorial no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - material/tutorial-regras-associacao-20261017.md
      - material/bi/**
      - material/imagens/**
      - material/cestas-validacao-20261017.json
      - material/regras-associacao-20261017.csv
      - dados/catalogo.json
      - scripts/gerar_site_tutorial.py
      - pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: pandoc/actions/setup@v1
        with:
          version: '3.10.1'
      - name: Gerar tutorial e explorador
        run: python scripts/gerar_site_tutorial.py --saida .local/pages-build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .local/pages-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
